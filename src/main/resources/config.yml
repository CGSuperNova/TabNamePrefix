# ============================================================
#  TabNamePrefix 配置文件
#
#  功能: 为 Tab 列表 / 玩家头顶的悬浮姓名牌添加「前缀 + 玩家名 + 后缀」
#  示例:
#    原版显示:  PlayerName
#    配置后:    [VIP] PlayerName
# ============================================================

# 总开关,设为 false 时插件不会修改任何玩家的 Tab 名称、姓名牌或排序
enabled: true

settings:
  # Tab 名称刷新间隔(单位:tick,20 tick = 1 秒)
  # 用于定期更新 PlaceholderAPI 变量(例如动画变量)以及权限组变动
  # 若设为 0,则只在玩家进服 / 执行 reload 时刷新一次
  refresh-interval-ticks: 20

  # 当无法通过 LuckPerms 获取权限组(未安装 LuckPerms)时,
  # 插件会检测玩家是否拥有「此前缀 + 条目里填写的权限组名」的权限节点,
  # 例如将 tabnameprefix.group.vip 权限授予 VIP 组即可命中下方 vip 条目。
  # 这样即使不装 LuckPerms,也能通过任意权限插件按组区分。
  group-node-prefix: "tabnameprefix.group."

  # ==========================================================
  #  悬浮姓名牌(玩家头顶的名字)
  #
  #  实现方式: Minecraft 的悬浮名字由计分板队伍(scoreboard team)的
  #  prefix / suffix 控制,因此本功能会为每个玩家创建并接管一个队伍。
  #
  #  ⚠ 注意:启用后会接管玩家所在的队伍,与其它「使用队伍实现彩色名字 /
  #    碰撞规则 / 发光」的插件可能冲突;如有冲突请关闭该功能。
  # ==========================================================
  nametag:
    # 是否同时修改玩家头顶的悬浮姓名牌
    enabled: false

    # true : 直接复用下方 entries 中该玩家命中条目的 prefix / suffix(与 Tab 列表一致)
    # false: 使用下面单独配置的 prefix / suffix
    use-entry-values: true

    # use-entry-values 为 false 时生效,支持颜色代码与 PlaceholderAPI 变量
    prefix: ""
    suffix: ""

# ============================================================
#  Tab 列表排序
#
#  enabled 为 false 时不改变玩家顺序(保持客户端默认的按名字排序)。
#  注意:排序同样基于计分板队伍名实现(旧版本客户端按队伍名排序),
#  因此在 Paper 1.21.9+ 上还会额外使用官方 playerListOrder 接口。
# ============================================================
sorting:
  enabled: false

  # 排序模式:
  #   none    - 不排序(保持默认按玩家名排序)
  #   numeric - 按数值变量排序
  #   list    - 按预设的固定顺序排序
  mode: none

  # ---------- mode: numeric ----------
  numeric:
    # 数值来源(PlaceholderAPI 变量),无法解析为数字的玩家会排在最后
    placeholder: "%player_level%"
    # true : 数值大的排前面(降序)
    # false: 数值小的排前面(升序)
    descending: true

  # ---------- mode: list ----------
  list:
    # 取值来源:
    #   prefix      - 取玩家命中条目的前缀(自动去除颜色代码后匹配)
    #   suffix      - 取玩家命中条目的后缀(自动去除颜色代码后匹配)
    #   placeholder - 使用下方 value 作为变量模板
    source: placeholder

    # source 为 placeholder 时使用,例如 %rank_rankname% 会解析为 Coal / Copper / ...
    value: "%rank_rankname%"

    # 预设顺序:越靠上的值排序越优先(大小写不敏感,忽略颜色代码)
    order:
      - "Diamond"
      - "Gold"
      - "Iron"
      - "Copper"
      - "Coal"

    # 不在 order 列表中的玩家排在哪里: last(最后) / first(最前)
    unmatched: last

# ============================================================
#  条目列表(从上到下依次解析)
#
#  每个条目的「匹配方式」(满足任一即视为匹配):
#    group:       玩家在 LuckPerms 中的权限组名(含继承的组,需安装 LuckPerms)
#    groups:      同 group,支持同时填写多个权限组名(列表)
#    permission:  玩家拥有该权限节点
#    -> 如果以上都不填写,该条目作为「默认/兜底」条目,对所有未匹配玩家生效
#
#  当多个条目同时匹配时:
#    1. priority 数值越大越优先(可选,默认 0)
#    2. 数值相同时,配置文件中位置越靠上越优先
#  因此建议把最高级的组放在最上面,默认条目放在最下面。
#
#  prefix / suffix 支持:
#    颜色代码:   &0-&9 &a-&f &k &l &m &n &o &r
#    十六进制:   &#RRGGBB (如 &#FF5555),也兼容 &x&F&F&5&5&5&5 写法
#    变量:       PlaceholderAPI 占位符,如 %player_name% %luckperms_prefix%
#                (需安装 PlaceholderAPI,未安装时占位符会原样显示)
#
#  注意: prefix / suffix 与玩家名之间不会自动添加空格,需要时请自行在末尾/开头加空格。
# ============================================================
entries:
  # ---------- 示例:服主 ----------
  owner:
    group: owner
    prefix: "&#FF5555[服主] &f"
    suffix: ""

  # ---------- 示例:管理员 ----------
  admin:
    groups:
      - admin
      - helper
    prefix: "&c[管理] &f"
    suffix: "&7"

  # ---------- 示例:VIP(多个组 + 权限节点混用) ----------
  vip:
    groups:
      - vip
      - mvip
    permission: "tabnameprefix.vip"
    prefix: "&#55FF55[VIP] &f"
    suffix: ""

  # ---------- 示例:纯权限节点匹配(不依赖 LuckPerms) ----------
  donor:
    permission: "tabnameprefix.donor"
    prefix: "&b[赞助] &f"
    suffix: ""

  # ---------- 默认(兜底):任何条目都未匹配时生效 ----------
  default:
    prefix: "&7"
    suffix: "&r"
