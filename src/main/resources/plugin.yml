name: TabNamePrefix
version: '${project.version}'
description: "在 Tab 列表与悬浮姓名牌中显示可配置的前缀/后缀,并支持自定义排序 (支持颜色代码与 PlaceholderAPI 变量)"
main: com.buzizi.tabNamePrefix.TabNamePrefix
api-version: '1.16'
load: POSTWORLD

authors: [ buzizi ]

softdepend: [ PlaceholderAPI, LuckPerms ]

commands:
  tabnameprefix:
    description: "TabNamePrefix 主命令"
    usage: "/<command> reload"
    aliases: [ tabp, tnp ]

permissions:
  tabnameprefix.reload:
    description: "允许执行 /tabnameprefix reload"
    default: op
