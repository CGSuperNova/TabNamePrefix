name: TabNamePrefix
version: '1.0-SNAPSHOT'
description: "在 Tab 列表中为不同权限组的玩家显示可配置的前缀/后缀,支持颜色代码与 PlaceholderAPI 变量"
main: com.buzizi.tabNamePrefix.TabNamePrefix
api-version: '1.20'
load: POSTWORLD

authors: [ buzizi ]

softdepend: [ PlaceholderAPI, LuckPerms ]

commands:
  tabnameprefix:
    description: "TabNamePrefix 主命令"
    usage: "/<command> reload"
    aliases: [ tabp, tnp ]

permissions:
  tabnameprefix.reload:
    description: "允许执行 /tabnameprefix reload"
    default: op
